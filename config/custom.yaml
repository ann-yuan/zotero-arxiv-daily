zotero:
  user_id: null # Not needed in standalone mode.
  api_key: null # Not needed in standalone mode.
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  generation_kwargs:
    model: gpt-4o-mini
  language: English
  bilingual: true

source:
  arxiv:
    category: ["cs.AI","cs.CV","cs.LG","cs.CL","cs.HC","cs.MM"]
    include_cross_list: true
  acl:
    lookback_hours: 24
  acm:
    lookback_hours: 24
    max_results: 100

scope:
  enabled: true
  drop_unmatched: true
  include_candidates: true
  candidate_name: candidate
  candidate_label: "相关候选 / 待确认"

executor:
  mode: standalone
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv', 'acl', 'acm']
